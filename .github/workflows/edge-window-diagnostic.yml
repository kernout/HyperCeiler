name: Edge window screenshot diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: edge-window-diagnostic
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d73c832a54771a808f138d91306e056203308850
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Inject temporary edge-window diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          rel='library/libhook/src/main/java/com/sevtinge/hyperceiler/libhook/rules/systemframework/display/ScreenshotCaptureWindowExclusion.java'
          p=Path(rel);s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='4be8ee6f2431268fde02a9671551330afd0129c1f73468e11a8a9377cb1237bc'
          needle='''WindowManager.LayoutParams lp = (WindowManager.LayoutParams) attrs.get(window);
                    Object target = null;'''
          assert s.count(needle)==1
          replacement='''WindowManager.LayoutParams lp = (WindowManager.LayoutParams) attrs.get(window);
                    if (current.logged++ < 80) {
                        Object taskForDiag = null;
                        int mode = -1;
                        int rootMode = -1;
                        try {
                            taskForDiag = getTask.invoke(window);
                            if (taskForDiag != null) {
                                mode = (int) getWindowingMode.invoke(taskForDiag);
                                Object rootForDiag = getRootTask.invoke(taskForDiag);
                                if (rootForDiag != null) rootMode = (int) getWindowingMode.invoke(rootForDiag);
                            }
                        } catch (Throwable t) {
                            diagnostic("EDGE_PROBE error=" + t.getClass().getSimpleName());
                        }
                        diagnostic("EDGE_WINDOW n=" + current.logged
                            + " type=" + lp.type + " pkg=" + lp.packageName
                            + " mode=" + mode + " rootMode=" + rootMode
                            + " windowClass=" + window.getClass().getName());
                    }
                    Object target = null;'''
          s=s.replace(needle,replacement,1)
          assert s.count('Object service;')==1
          s=s.replace('Object service;','int logged;\n        Object service;',1)
          assert s.count('diagnostic("NO_MATCH display=" + current.displayId);')==1
          s=s.replace('diagnostic("NO_MATCH display=" + current.displayId);','diagnostic("EDGE_NO_MATCH visited=" + current.logged + " display=" + current.displayId);',1)
          assert s.count('diagnostic("CAPTURE_EXCLUSIONS display=" + current.displayId')==1
          s=s.replace('diagnostic("CAPTURE_EXCLUSIONS display=" + current.displayId','diagnostic("CAPTURE_EXCLUSIONS visited=" + current.logged + " display=" + current.displayId',1)
          p.write_text(s)
          Path(os.environ['RUNNER_TEMP'],'edge-build-info.json').write_text(json.dumps({'base_commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'variant':'edge-diag-v1','behavior':'diagnostic logging only; exclusion policy unchanged'},indent=2))
          PY
          git diff --check
      - name: Disable release signing
        shell: bash
        run: |
          set -euo pipefail
          test ! -f signing.properties
          cat >> app/build.gradle.kts <<'EOF'

          android.buildTypes.named("release") {
              signingConfig = null
              versionNameSuffix = "-edge-diag-v1"
          }
          EOF
      - name: Build diagnostic APK
        env:
          GIT_ACTOR: ${{ secrets.GIT_ACTOR || github.actor }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          files=list(Path('app/build/outputs/apk/release').rglob('*.apk'))
          assert len(files)==1,files
          sdk=os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT')
          result=subprocess.run([str(Path(sdk)/'build-tools/37.0.0/apksigner'),'verify',str(files[0])],capture_output=True,text=True)
          assert result.returncode!=0,'Unexpected signed APK'
          out=Path('artifacts/HyperCeiler-edge-diag-v1-unsigned.apk');shutil.copy2(files[0],out)
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          info=json.loads(Path(os.environ['RUNNER_TEMP'],'edge-build-info.json').read_text());info.update({'sha256':sha,'signed':False,'run_id':os.environ['GITHUB_RUN_ID']})
          Path('artifacts/build-info.json').write_text(json.dumps(info,indent=2))
          Path('artifacts/SHA256SUMS').write_text(f'{sha}  {out.name}\n')
          Path('artifacts/TESTING.txt').write_text('Diagnostic only. Keep screenshot-hide-freeform enabled and test normal freeform plus edge-pinned freeform screenshots. Export logs containing EDGE_WINDOW, EDGE_NO_MATCH, CAPTURE_EXCLUSIONS, EXCLUSION_FAILED. This build does not change exclusion behavior. Sign before installation.\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-edge-diag-v1
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
