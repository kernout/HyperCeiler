zUM8J)ao}tZq;<QUC<DBn8hAzwn4<ORh%&d3wr$rOUv5A7%cc$SWD#VoJc>2_baN~A}rUC_yq6sthQOHaTxJOGuH=%BFV?YL6TNWoAi7Mv|><-H@EcfdUcho;G);dgXv-lCF~8?kHKy9&yKKkVlqGA93eSP|5DCa-y?^i9^9x|amMSF|MDB=1(ELSQQiKL*JH6gHpARi5|2Qo=<vvXr)BFX#s(UEOC?vxnF9@Xps-=9Gi=6{w7-~y;eSVAQ*pRjhBPJzRjfv<$S=#j=7@xTGSg)qKGMbOs+rNB>qr41<~+$-0Bkxr9}Pn*ekMjT9o1}7WevC{3*%hZ@yd7}uEy2ke*ATmKl$8}o7>>P^esTCr8Pf`VR$pa@*yY;P`)@0aX4b@+r5_lx2TZ9ZrY-aqPT%9wv72bql*FrmR6iYFw||D+8rG$+5LcH<taM58P2%&26ZLne=U(Z@&~nYNtd*TT6XV{1;V+mp6lv_ng{bRO|RP(zZLw<n4Ddo=c}Rg!Dv;R_i{GC<6r;)uckzjy?X}i00EO6=2-v$Xu-~HvBYQl0ssI200dcD
          B85
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,os,subprocess,xml.etree.ElementTree as E
          w=Path(os.environ['RUNNER_TEMP'],'privacy');h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          g=lambda *a:subprocess.check_output(['git',*a]).decode().strip()
          b=lzma.decompress(base64.b85decode(''.join((w/'island.b85').read_text().split())))
          assert hashlib.sha256(b).hexdigest()=='3b1f0c29919539fd136c89fa6b5b349ed221e0c0d477da2506adaa8727ca2248'
          head,patch=b.split(b'\n',1);m=json.loads(head)
          assert hashlib.sha256(patch).hexdigest()==m['production_patch_sha256']=='2099ad2304771c0858745bb4ff7766a42eb54a6306fd9df36bc4c5fdf1764f8f'
          assert g('rev-parse','HEAD')=='3b481faa688811fefbf434a09c8495b668e10c1b'
          info=json.loads((w/'build-info.json').read_text());assert info['variant']=='screenshot-privacy-test-v2'
          def snap():
              return {n:h(n) for n in g('ls-files','-co','--exclude-standard','-z').split('\0') if n and Path(n).is_file()}
          before=snap();changes=m['changed'];names={x['path'] for x in changes}
          assert len(changes)==len(names)==5
          assert all(before.get(x['path'])==x['before_sha256'] for x in changes)
          assert all(before.get(n)==s for n,s in info['source_hashes'].items())
          pin=info['pin_source_path'];base_pin=info['pin_source_sha256']
          assert before[pin]==base_pin=='fad684d3319ee2bcb1a930eac425e8ef9599c7208db0bf7d4007f7ce800f8bc6'
          res=Path('library/core/src/main/res');ns='{http://schemas.android.com/apk/res/android}'
          def switches():
              return {str(f):[(n.tag,dict(n.attrib)) for n in E.parse(f).iter() if n.get(ns+'key')] for f in sorted((res/'xml').glob('*.xml'))}
          old_switches=switches()
          p=w/'island.patch';p.write_bytes(patch)
          g('apply','--check',str(p));g('apply',str(p));after=snap()
          assert set(after)==set(before)
          assert {n for n in before if before[n]!=after[n]}==names
          assert all(after[x['path']]==x['after_sha256'] for x in changes)
          key='system_ui_status_bar_hide_island';pref='prefs_key_'+key
          new_switches=switches();nodes=[a for items in new_switches.values() for _,a in items if a.get(ns+'key')==pref]
          assert len(nodes)==1 and nodes[0].get(ns+'defaultValue')=='false' and ns+'dependency' not in nodes[0]
          assert {f:[(t,a) for t,a in items if a.get(ns+'key')!=pref] for f,items in new_switches.items()}==old_switches
          for f in [res/'values/strings_app.xml',res/'values-zh-rCN/strings_app.xml']:
              n=[n.get('name') for n in E.parse(f).getroot() if n.get('name')];assert len(n)==len(set(n))
          g('diff','--check');changed_pin=after[pin]
          assert changed_pin=='7b6a42d4a00e3006940a2433d30889e929c2ca9097d626aa4c59aea67205c512'
          info['switches_default_off'][key]=False
          # Historical v1/v2 manifests remain provenance; current hashes describe island sources.
          info.update(variant='screenshot-island-test-v1',island_bootstrap_commit='2f8c7b302343bca2ba17d43aa0ae793c7515b3dd',v2_workflow_sha256='d0fa3d5a215ad57b08f44427ac850e139c45535234310a09eb9c107e38596bde',island_manifest=m,island_patch_sha256=m['production_patch_sha256'],source_hashes=after,pin_source_sha256=changed_pin,base_pin=base_pin,changed_pin=changed_pin,pin_hash_meaning='base_pin: verified v2 capture source before island delta; changed_pin/pin_source_sha256: final island capture source; historical manifests are provenance',other_pin_files_unchanged=False,v2_other_sources_unchanged=True,old_switches_unchanged=True,island_device_verified=False,source_hashes_stage='after island injection; app/build.gradle.kts refreshed after unsigned release')
          info['after']={n:after[n] for n in info['after']}
          (w/'build-info.json').write_text(json.dumps(info,indent=2)+'\n')
          print('PASS exact five-file island delta; all other v2 sources and old switches unchanged; island OFF')
          PY
      - name: Unsigned release
        shell: bash
        run: |
          set -euo pipefail
          test ! -f signing.properties
          printf '\nandroid.buildTypes.named("release") { signingConfig = null; versionNameSuffix = "-screenshot-island-test-v1" }\n' >> app/build.gradle.kts
      - name: Assemble
        env:
          GIT_ACTOR: ${{ secrets.GIT_ACTOR || github.actor }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,struct,subprocess,zipfile
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          apks=list(Path('app/build/outputs/apk/release').rglob('*.apk'));assert len(apks)==1,apks
          src=apks[0];b=src.read_bytes()
          with zipfile.ZipFile(src) as z:
              assert z.testzip() is None
              names=z.namelist();assert len(names)==len(set(names))
              assert all(n in names for n in ['AndroidManifest.xml','classes.dex','resources.arsc'])
              assert not any(n.upper().startswith('META-INF/') and (n.upper()=='META-INF/MANIFEST.MF' or n.upper().endswith(('.SF','.RSA','.DSA','.EC'))) for n in names)
          e=b.rfind(b'PK\x05\x06',max(0,len(b)-65557));assert e>=0 and e+22+struct.unpack_from('<H',b,e+20)[0]==len(b)
          cd=struct.unpack_from('<I',b,e+16)[0];assert 24<=cd<e and b[cd-16:cd]!=b'APK Sig Block 42'
          sdk=os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT');assert sdk
          signer=Path(sdk)/'build-tools/37.0.0/apksigner';assert signer.is_file()
          c=subprocess.run([str(signer),'verify','--verbose','--print-certs',str(src)],capture_output=True,text=True)
          log=c.stdout+c.stderr
          assert c.returncode==1 and 'DOES NOT VERIFY' in log and 'Missing META-INF/MANIFEST.MF' in log,log
          w=Path(os.environ['RUNNER_TEMP'],'privacy');info=json.loads((w/'build-info.json').read_text())
          assert info['variant']=='screenshot-island-test-v1'
          assert h(info['pin_source_path'])==info['changed_pin']==info['pin_source_sha256']
          config='app/build.gradle.kts';suffix=b'\nandroid.buildTypes.named("release") { signingConfig = null; versionNameSuffix = "-screenshot-island-test-v1" }\n'
          build=Path(config).read_bytes();assert build.endswith(suffix)
          assert hashlib.sha256(build[:-len(suffix)]).hexdigest()==info['source_hashes'][config]
          assert all(h(n)==s for n,s in info['source_hashes'].items() if n!=config)
          info['source_hashes'][config]=h(config);info['source_hashes_stage']='final build inputs, including unsigned release override'
          out=Path('artifacts');out.mkdir(exist_ok=True);assert not list(out.iterdir())
          apk=out/'HyperCeiler-screenshot-island-test-v1-unsigned.apk';shutil.copy2(src,apk)
          info.update(signed=False,apksigner_returncode=c.returncode,apk_sha256=hashlib.sha256(b).hexdigest(),apk_name=apk.name)
          (out/'build-info.json').write_text(json.dumps(info,indent=2)+'\n')
          (out/'apksigner.txt').write_text(log)
          (out/'TESTING.txt').write_text('screenshot-island-test-v1 / SDK37+ / HyperOS4. Unsigned APK: sign before installation. Host tests are not device verification.\nSuper Island: System UI > Status bar > Hide Super Island in screenshots; independent, default OFF, no dependency on status-bar hiding. Restart relevant framework processes after changing; device reboot recommended. Screenshot exclusion only; live display and recording are not changed.\nRule: type 2009, exact DynamicIslandWindow title, package miui.systemui.plugin/com.android.systemui, owner UID resolves to com.android.systemui. Covers the window Surface subtree. Reparented return animations/Glow/element surfaces may remain; island-reserved layout space may remain. Confirm folded/expanded screenshots, island-only switch, live flicker and unchanged recording on device.\nAll prior v2 source behavior and switch defaults retained: media notification suppression; app screenshot callback blocking; screenshot/recorder Pictures/xml directory and filename prefix options. Callback only blocks final reportScreenCaptured dispatch; this ROM registerScreenCaptureObserver is empty. Only new targeted exports; no historic file moves. Prefix stripping is case-sensitive and once only; unsafe suffixes retained. Media list refresh and file/query observation are not guaranteed hidden.\nbase_pin is the SHA-verified v2 capture source; changed_pin/pin_source_sha256 is the final island capture source. Other historical manifests retain their original provenance hashes. source_hashes describes final source/build inputs, including unsigned release override.\n',encoding='utf-8')
          (out/'SHA256SUMS').write_text(''.join(h(p)+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.name!='SHA256SUMS'))
          print('PASS unsigned island APK',info['apk_sha256'])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-screenshot-island-test-v1
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
