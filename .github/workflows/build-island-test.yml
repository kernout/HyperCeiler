name: HyperCeiler screenshot island test
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: hyperceiler-screenshot-island-test-v1
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2f8c7b302343bca2ba17d43aa0ae793c7515b3dd
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Bootstrap verified v2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,subprocess
          w=Path(os.environ['RUNNER_TEMP'],'privacy');w.mkdir(parents=True,exist_ok=True)
          g=lambda *a:subprocess.check_output(['git',*a]).decode().strip()
          assert g('rev-parse','HEAD')=='2f8c7b302343bca2ba17d43aa0ae793c7515b3dd'
          f=Path('.github/workflows/build-privacy-v2-test.yml');b=f.read_bytes()
          assert hashlib.sha256(b).hexdigest()=='d0fa3d5a215ad57b08f44427ac850e139c45535234310a09eb9c107e38596bde'
          (w/'v2.yml').write_bytes(b)
          s=b.decode().splitlines();a=s.index('      - name: Apply verified v2 sources');z=s.index('      - name: Unsigned release',a)
          a=s.index('        run: |',a)+1
          assert a<z and all(not x or x.startswith(' '*10) for x in s[a:z])
          (w/'apply-v2.sh').write_text('\n'.join(x[10:] for x in s[a:z])+'\n')
          g('checkout','--detach','87567060d4815c7bf4b00ce51ae42c3f771ec444')
          PY
          bash "$RUNNER_TEMP/privacy/apply-v2.sh"
      - name: Apply verified island sources
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/privacy/island.b85" <<'B85'
          {Wp48S^xk9=GL@E0stWa8~^|S5YJf5;4I}0_gw%zh=@j1Yz2mgmuWkg1j8a*S7@RGJ!h+!0M&Wj>_s{yFx3oH@@G-73HB-uwbUOBVqF2ZSV%b7Ci%Z*?kH1Ch4!W0P{0{3X)T}P^zT9PfM$nS)C>=(%{HXFzrqY>b41jI6{|SoWL#<dXDKi6Et8#9N=b5cP@A~uKAbNTlM1b;?NH!n<d04;gsZ$3=dr5rul33(lW&b6$YGZtHH6_dl?ZddI4bt~Cm5##SHv8eW;Z}DOV(M#%Gwoc43|R_j0iFY;SoJ^J!V{W>LBFgl)W0Bj~~F-K+>D7-9=}7HtU9{fHM!{1e<uZG~N*1{=e%Jd@|JSN+<S8o;XFv(zSR?<ztIU0L&RPb)-Uquu`gb#vZZjOMP2VgZTPuhF!cxS-+!wOq6GBVK0JM3j_}mqn(P#&OhkdW8`27Ei^bd`d*q4Sxu2x3^jY3j#M$NgUL|S-VU@KT~!u0larL*$*?oHHJ3~z_>AIaR->QCHp7{ZP2xCLJeQU%L#A2|CiK8kp1lU8%DckW_zYndtPSiXoYPL%jS?URr{uF)GejNOl}&mKr)`c7IRi-Gs^;k5w%+#ckawgN7ad0T^(WPZz!0^<kWoN@96`=!PvGM>|H8p1P5@Df#BPSSmGdy&^s|ts^m8<a77(5Haf%`KBlsB=2rG!lL$yJH54V<d|92a@siU1!imTnu^;|(;5069t8%Y($)>Hk8zm)juu2wyD_f)V|<|JoZx87ilp2`#h))SCzUL&Vp#1=@m4TT!~?1Jz=EYEN5wS%cq&Y47WzFt{cYUy1a9|}>md8;xE1Ji|QYB`SfaLE~n02`{2j=N%XU0aE52ktUB*Y_NYl&;={^@1&}6AqvEA;>!3eu(s?KThK5s}QFu=}gwSDe8JOKchle4(`Q$;$ak0N*+tSXB!EV8O{qXn^sRHF>xs9pAJw)Yc8hfKkj$9(ex<~cV6Beu&un>o5XS47XdaV@Yv4L$qq%d`|km@6l|3JhE*Ke7zoFa65!kF^lZ>w*w~^Gb#-kVbUfvSn`wUBSj-5w4x2dH<*`R)>y+xZ$D}maM9iZywvBl#NxLD}bp~b=<)diUrmOVP4b)Oa5pqX+%+dIyKWGSqCoHwR<JXgewh=_UTcWn`*p$U1uBpJ_!g$+Fq{m~6z|?G@vl3%noXy)dyrVAy$}#K0k2EPo0Ld3O18=6U`?JH_3!<<60-@eL<lT(@wjeH(GV>o|@A+OMb{qRyM{wm00w%uX7!a{W9+3(wk&1*Lv1jYOICr>S`kqZRrw?xKf|01U8;LUUoNzyS1qDcvOZydGwa8LSZ$*FOKCBN(0?_-i2L5Ct3RQ{Cci(oHN`N{$);2H8fc!tR$cSBF0h~Rmoy^#${|1xsBN)HYYS-odCv2v70U#Hp((s1d$*%@E0|RbuLdPbBp>BUEe$Jv6TT%=BOS26rLgemZN+rM$m2DNrr&Z2RFjQlGbs~P@k32=|``o0uKh2f3mZesL(>Z|pC2aJhl{kI34l3ceeMv2$qpdL=@{2II_QR1=7d0B<wlM~9?>`s}IN-vcq>u<0Ux;ITe;?dmRopZ3ao#QM7-mndX!tYA(sMK1_0PjI22O@Ov>*`%8~QSy`r2PG1p#7gV7hJT?Yl!bUWPZQR7J-!#!jX{jaUO6*ZaBfw2vD}>kmM8|3odLm!EXE#K~9_y^ieCK@f9g={g?S5FxKsPzx1KrT>?hPqBt?7|zX!9V2kXH#PSG+cpP}NEthaeMP9;MrZ!DTVoT$I6uY5De!1tMG~*-j&b9!-8oOx@`|Fsx+ne$tr+n~eS{fV-ztoib3a0<Iza^zGy{=LoXBxOJ>;P*UsI`tW=0B-@MwpC=G$IbXJ4!^64!@ld7Wi4l6LM#*w>Sh8S$Ab`q2UX{4KCW@va4mg}L)Wob6)MnqC0*b#6pOps{7BAb_H>us`kZ`nwyY2rR8KsWfx+yZyNq@7yjQz3l^M$L3<hOANV?5JBM5BWJ~q)9FL8D=eXa