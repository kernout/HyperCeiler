name: Recorder native power unsigned
'on':
  push:
    branches: [kernout-patch-1]
    paths: [.github/workflows/recorder-native-power-build.yml]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
concurrency:
  group: recorder-native-power
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify complete source and push production branch first
        env:
          GIT_TOKEN: ${{ github.token }}
          GIT_ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          PAYLOAD = ''.join(Path('.github/recorder-native-power/part-%02d.b64'%i).read_text().strip() for i in range(3))
          scripts = {}
          for label, count, expected in [('prepare',2,'d0fc59fe856524f2ee448c41e4a9295f0e59bc1783e5311e3dfa288d97a5aad6'),('collect',1,'6f53dcb96da707feb79aa11a49689a89c778d258a2a4f6dd956c0a7cfcd207b6')]:
              pieces = []
              for i in range(count):
                  filename = '.github/recorder-native-power/%s-%02d.py'%(label,i)
                  namespace = {}
                  exec(compile(Path(filename).read_text(),filename,'exec'),namespace)
                  pieces.append(namespace['DATA'])
              code = lzma.decompress(base64.b64decode(''.join(pieces),validate=True))
              assert hashlib.sha256(code).hexdigest()==expected,label
              compile(code,label,'exec')
              scripts[label]=code
          collector=Path(os.environ['RUNNER_TEMP'])/'recorder-native-power-collect.py'
          collector.write_bytes(scripts['collect'])
          exec(compile(scripts['prepare'],'prepare','exec'),dict(PAYLOAD=PAYLOAD))
          PY
      - name: Assemble unsigned release
        env:
          GIT_TOKEN: ${{ github.token }}
          GIT_ACTOR: ${{ github.actor }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify unsigned APK
        run: python3 "$RUNNER_TEMP/recorder-native-power-collect.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HyperCeiler-recorder-native-power-unsigned
          path: artifacts/
          if-no-files-found: error
