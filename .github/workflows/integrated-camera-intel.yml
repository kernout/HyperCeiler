name: Integrated camera Intel
on:
  workflow_dispatch:
  push:
    branches: [kernout-patch-1]
    paths: [.github/workflows/integrated-camera-intel.yml]
permissions: {contents: write, packages: read}
concurrency: {group: integrated-camera, cancel-in-progress: false}
