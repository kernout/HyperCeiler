name: Edge window screenshot diagnostics v2
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: edge-window-diagnostic-v2
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d73c832a54771a808f138d91306e056203308850
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Inject v2 diagnostics and merge UI switches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          rel = 'library/libhook/src/main/java/com/sevtinge/hyperceiler/libhook/rules/systemframework/display/ScreenshotCaptureWindowExclusion.java'
          p = Path(rel)
          s = p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest() == '4be8ee6f2431268fde02a9671551330afd0129c1f73468e11a8a9377cb1237bc'
          def one(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)
          one('import java.lang.reflect.Constructor;', 'import java.io.FileWriter;\nimport java.lang.reflect.Constructor;')
          one('        hideFreeform = PrefsBridge.getBoolean("system_ui_status_bar_hide_freeform");', '        hideFreeform = PrefsBridge.getBoolean("system_ui_status_bar_hide_freeform")\n            || PrefsBridge.getBoolean("system_ui_status_bar_hide_overlay");\n        edgeDiag("INSTALL sdk=" + android.os.Build.VERSION.SDK_INT + " status=" + hideStatusBar\n            + " smallWindow=" + hideFreeform);')
          one('                    current.allowed = isScreenshotCaller(current.service);', '                    current.allowed = isScreenshotCaller(current.service);\n                    edgeDiag("CAPTURE allowed=" + current.allowed + " display=" + current.displayId);')
          one('                    WindowManager.LayoutParams lp = (WindowManager.LayoutParams) attrs.get(window);', '''                    WindowManager.LayoutParams lp = (WindowManager.LayoutParams) attrs.get(window);
                    if (current.logged++ < 80) {
                        int mode = -1, rootMode = -1;
                        try {
                            Object task = getTask.invoke(window);
                            if (task != null) {
                                mode = (int) getWindowingMode.invoke(task);
                                Object rootTask = getRootTask.invoke(task);
                                if (rootTask != null) rootMode = (int) getWindowingMode.invoke(rootTask);
                            }
                        } catch (Throwable t) {
                            edgeDiag("PROBE_ERROR " + t.getClass().getSimpleName());
                        }
                        edgeDiag("WINDOW n=" + current.logged + " type=" + lp.type
                            + " pkg=" + lp.packageName + " mode=" + mode + " rootMode=" + rootMode
                            + " cls=" + window.getClass().getName());
                    }''')
          one('        Object service;', '        int logged;\n        Object service;')
          one('diagnostic("NO_MATCH display=" + current.displayId);', 'edgeDiag("NO_MATCH display=" + current.displayId + " visited=" + current.logged);')
          one('diagnostic("CAPTURE_EXCLUSIONS display=" + current.displayId', 'edgeDiag("EXCLUSIONS display=" + current.displayId + " visited=" + current.logged')
          one('    private static void diagnostic(String message) {', '''    private static void edgeDiag(String message) {
        String line = "EDGE_V2 " + message;
        try { Log.e("HC-Screenshot", line); } catch (Throwable ignored) {}
        try { XposedLog.w(TAG, PACKAGE, line); } catch (Throwable ignored) {}
        try (FileWriter writer = new FileWriter("/data/local/tmp/HyperCeiler-screenshot-edge-v2.log", true)) {
            writer.write(line + "\\n");
        } catch (Throwable ignored) {}
    }

    private static void diagnostic(String message) {''')
          p.write_text(s)
          xml = Path('library/core/src/main/res/xml/system_ui_status_bar.xml')
          x = xml.read_text()
          block = '''        <SwitchPreference
            android:defaultValue="false"
            android:key="prefs_key_system_ui_status_bar_hide_overlay"
            android:title="@string/system_ui_status_bar_hide_overlay"
            android:summary="@string/system_ui_screenshot_exclusion_desc" />
'''
          assert x.count(block) == 1
          xml.write_text(x.replace(block, ''))
          for f, old, new in [
              ('library/core/src/main/res/values-zh-rCN/strings_app.xml', '截屏时隐藏小窗', '截屏时隐藏小窗（含贴边小窗）'),
              ('library/core/src/main/res/values/strings_app.xml', 'Hide floating app windows in screenshots', 'Hide floating app windows in screenshots (including edge-pinned windows)')]:
              q = Path(f)
              z = q.read_text()
              assert z.count(old) == 1
              q.write_text(z.replace(old, new, 1))
          Path(os.environ['RUNNER_TEMP'], 'edge-v2-info.json').write_text(json.dumps({
              'base': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
              'variant': 'edge-diag-v2',
              'ui': 'one hide-small-window option; legacy overlay preference is absorbed',
              'diagnostic_file': '/data/local/tmp/HyperCeiler-screenshot-edge-v2.log'
          }, indent=2))
          PY
          git diff --check
          python3 tests/screenshot-window/run_tests.py
          python3 tests/hide-statusbar-screenshot/run.py .
      - name: Disable signing and build v2 APK
        shell: bash
        run: |
          set -euo pipefail
          test ! -f signing.properties
          cat >> app/build.gradle.kts <<'EOF'

          android.buildTypes.named("release") {
              signingConfig = null
              versionNameSuffix = "-edge-diag-v2"
          }
          EOF
      - name: Assemble v2 diagnostic APK
        env:
          GIT_ACTOR: ${{ secrets.GIT_ACTOR || github.actor }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify and collect v2 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          files = list(Path('app/build/outputs/apk/release').rglob('*.apk'))
          assert len(files) == 1, files
          sdk = os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT')
          result = subprocess.run([str(Path(sdk) / 'build-tools/37.0.0/apksigner'), 'verify', str(files[0])], capture_output=True, text=True)
          assert result.returncode != 0, 'Unexpected signed APK'
          out = Path('artifacts/HyperCeiler-edge-diag-v2-unsigned.apk')
          shutil.copy2(files[0], out)
          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          info = json.loads(Path(os.environ['RUNNER_TEMP'], 'edge-v2-info.json').read_text())
          info.update({'sha256': sha, 'signed': False, 'run_id': os.environ['GITHUB_RUN_ID']})
          Path('artifacts/build-info.json').write_text(json.dumps(info, indent=2))
          Path('artifacts/SHA256SUMS').write_text(f'{sha}  {out.name}\n')
          Path('artifacts/TESTING.txt').write_text('V2 diagnostic only. UI has one hide-small-window option including edge-pinned windows. Enable Android scope in LSPosed and reboot. Test ordinary, left-edge and right-edge pinned windows. Pull /data/local/tmp/HyperCeiler-screenshot-edge-v2.log with root and also collect logcat filtered by HC-Screenshot. No new edge exclusion is claimed yet. Sign before installation.\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-edge-diag-v2
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
