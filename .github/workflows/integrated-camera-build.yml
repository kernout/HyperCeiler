name: Integrated camera
on:
  workflow_dispatch:
  push:
    branches: [kernout-patch-1]
    paths: [.github/workflows/integrated-camera-build.yml]
permissions: {contents: write, packages: read}
concurrency: {group: integrated-camera, cancel-in-progress: false}
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
