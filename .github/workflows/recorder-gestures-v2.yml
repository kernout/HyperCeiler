name: Recorder v2
on:
  push:
    branches: [kernout-patch-1]
    paths: [.github/workflows/recorder-gestures-v2.yml]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
concurrency:
  group: recorder-gestures-v2
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - env:
          GIT_TOKEN: ${{ github.token }}
          GIT_ACTOR: ${{ github.actor }}
        run: |
          cp -R .github/recorder-v2-source "$RUNNER_TEMP/recorder-v2-source"
          python3 - <<'PY'
          import base64,hashlib,os,zlib
          from pathlib import Path
          b=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(b).hexdigest()=='4db392f6fd79bdd472a218dc04993123d9f28e8273f2d654696a598cffd7fa96'
          Path(os.environ['RUNNER_TEMP'],'recorder-v2-runtime.py').write_bytes(b)
          PY
          python3 "$RUNNER_TEMP/recorder-v2-runtime.py" restore "$RUNNER_TEMP/recorder-v2-source"
      - env:
          GIT_TOKEN: ${{ github.token }}
          GIT_ACTOR: ${{ github.actor }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - run: python3 "$RUNNER_TEMP/recorder-v2-runtime.py" collect
      - uses: actions/upload-artifact@v4
        with:
          name: HyperCeiler-recorder-gestures-v2-unsigned
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
