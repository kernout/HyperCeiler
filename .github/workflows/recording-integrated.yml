name: Integrated screen-off recorder
'on':
  push:
    branches: [kernout-patch-1]
    paths: [.github/workflows/recording-integrated.yml]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
concurrency:
  group: integrated-screen-off-recorder
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      GIT_ACTOR: ${{ secrets.GIT_ACTOR || github.actor }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore verified baseline and persist production source
        shell: bash
        run: |
          set -euo pipefail
          cp -R .github/recording-source "$RUNNER_TEMP/recording-source"
          python3 - <<'PY'
          import base64,os,zlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'recording-ci.py'
          p.write_bytes(zlib.decompress(base64.b64decode('')))
          PY
          python3 "$RUNNER_TEMP/recording-ci.py" restore "$RUNNER_TEMP/recording-source"
      - name: Assemble unsigned release
        shell: bash
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Verify unsigned APK and collect provenance
        shell: bash
        run: python3 "$RUNNER_TEMP/recording-ci.py" collect
      - uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-integrated-recorder-test-v1
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
