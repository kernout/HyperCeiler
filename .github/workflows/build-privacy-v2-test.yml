      - name: Unsigned release
        shell: bash
        run: |
          set -euo pipefail
          test ! -f signing.properties
          printf '\nandroid.buildTypes.named("release") { signingConfig = null; versionNameSuffix = "-screenshot-privacy-test-v2" }\n' >> app/build.gradle.kts
      - name: Assemble
        env:
          GIT_ACTOR: ${{ secrets.GIT_ACTOR || github.actor }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace
      - name: Verify APK
