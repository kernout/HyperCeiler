name: Edge window candidate APK
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: edge-window-candidate
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d73c832a54771a808f138d91306e056203308850
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply verified local candidate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          p=Path('library/libhook/src/main/java/com/sevtinge/hyperceiler/libhook/rules/systemframework/display/ScreenshotCaptureWindowExclusion.java')
          raw=p.read_bytes();assert hashlib.sha256(raw).hexdigest()=='4be8ee6f2431268fde02a9671551330afd0129c1f73468e11a8a9377cb1237bc'
          pin=Path('library/libhook/src/main/java/com/sevtinge/hyperceiler/libhook/rules/systemframework/freeform/UnForegroundPin.java')
          assert hashlib.sha256(pin.read_bytes()).hexdigest()=='73ae5dad42d8f9213bfcabf021254dc530963bced9b5a8f82487f0ec9c3579e0'
          lines=raw.decode().splitlines();hits=[i for i,x in enumerate(lines) if x.strip()=='Object rootTask = getRootTask.invoke(task);'];assert len(hits)==1
          i=hits[0];assert lines[i+1].strip().startswith('target = rootTask != null && ScreenshotWindowPolicy.freeform(');assert lines[i+2].strip().startswith('(int) getWindowingMode.invoke(rootTask)');assert lines[i+3].strip()=='kind = "freeform";'
          indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
          lines[i:i+4]=[indent+'// Capture-only candidate: keep foreground-pinned root task active.',indent+'target = window;',indent+'kind = "freeform-window";']
          out=('\n'.join(lines)+'\n').encode();assert b'getRootTask.invoke(task)' not in out;assert out.count(b'kind = "freeform-window";')==1;p.write_bytes(out)
          Path(os.environ['RUNNER_TEMP'],'candidate-info.json').write_text(json.dumps({'base':'d73c832a54771a808f138d91306e056203308850','candidate':'window-surface-not-root-task','foreground_pin_unchanged':True,'source_sha256':hashlib.sha256(out).hexdigest()},indent=2))
          PY
          git diff --check
      - name: Disable signing
        shell: bash
        run: |
          set -euo pipefail
          test ! -f signing.properties
          cat >> app/build.gradle.kts <<'EOF'

          android.buildTypes.named("release") {
              signingConfig = null
              versionNameSuffix = "-edge-candidate"
          }
          EOF
      - name: Assemble candidate APK
        env:
          GIT_ACTOR: ${{ secrets.GIT_ACTOR || github.actor }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Collect candidate APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          files=list(Path('app/build/outputs/apk/release').rglob('*.apk'));assert len(files)==1,files
          sdk=os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT')
          r=subprocess.run([str(Path(sdk)/'build-tools/37.0.0/apksigner'),'verify',str(files[0])],capture_output=True,text=True)
          assert r.returncode!=0,'Unexpected signed APK'
          out=Path('artifacts/HyperCeiler-edge-candidate-unsigned.apk');shutil.copy2(files[0],out)
          sha=hashlib.sha256(out.read_bytes()).hexdigest();info=json.loads(Path(os.environ['RUNNER_TEMP'],'candidate-info.json').read_text());info.update({'signed':False,'sha256':sha,'run_id':os.environ['GITHUB_RUN_ID']})
          Path('artifacts/SHA256SUMS').write_text(f'{sha}  {out.name}\n');Path('artifacts/build-info.json').write_text(json.dumps(info,indent=2))
          Path('artifacts/TESTING.txt').write_text('Experimental candidate only. UnForegroundPin is unchanged. Screenshot exclusion targets the concrete freeform WindowState surface instead of the root-task surface. Test foreground-pinned edge windows remain active during screenshots. Compare ordinary freeform and left/right edge-pinned windows. Sign before installation.\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-edge-candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
