name: Edge window candidate APK
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: edge-window-candidate
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d73c832a54771a808f138d91306e056203308850
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply verified local candidate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('library/libhook/src/main/java/com/sevtinge/hyperceiler/libhook/rules/systemframework/display/ScreenshotCaptureWindowExclusion.java')
          s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='4be8ee6f2431268fde02a9671551330afd0129c1f73468e11a8a9377cb1237bc'
          lines=s.splitlines()
          hits=[i for i,line in enumerate(lines) if line.strip()=='Object rootTask = getRootTask.invoke(task);']
          assert len(hits)==1
          i=hits[0]; indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
          assert lines[i+1].strip().startswith('target = rootTask != null && ScreenshotWindowPolicy.freeform(')
          assert lines[i+2].strip()=='kind = "freeform";'
          assert lines[i+3].strip()=='}'
          lines[i:i+3]=[indent+'// Capture-only candidate: leave the MIUI foreground-pinned root task untouched.',indent+'target = window;',indent+'kind = "freeform-window";']
          s='\n'.join(lines)+'\n'
          assert 'getRootTask.invoke(task)' not in s and 'kind = "freeform-window"' in s
          p.write_text(s)
          PY
          git diff --check
      - name: Disable signing
        shell: bash
        run: |
          set -euo pipefail
          test ! -f signing.properties
          cat >> app/build.gradle.kts <<'EOF'

          android.buildTypes.named("release") {
              signingConfig = null
              versionNameSuffix = "-edge-candidate"
          }
          EOF
      - name: Assemble candidate APK
        env:
          GIT_ACTOR: ${{ secrets.GIT_ACTOR || github.actor }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Collect candidate APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          files=list(Path('app/build/outputs/apk/release').rglob('*.apk'));assert len(files)==1,files
          sdk=os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT')
          r=subprocess.run([str(Path(sdk)/'build-tools/37.0.0/apksigner'),'verify',str(files[0])],capture_output=True,text=True)
          assert r.returncode!=0,'Unexpected signed APK'
          out=Path('artifacts/HyperCeiler-edge-candidate-unsigned.apk');shutil.copy2(files[0],out)
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('artifacts/SHA256SUMS').write_text(f'{sha}  {out.name}\n')
          Path('artifacts/build-info.json').write_text(json.dumps({'base_commit':'d73c832a54771a808f138d91306e056203308850','candidate':'window-surface-not-root-task','signed':False,'sha256':sha,'run_id':os.environ['GITHUB_RUN_ID']},indent=2))
          Path('artifacts/TESTING.txt').write_text('Experimental candidate only. UnForegroundPin remains unchanged. Screenshot exclusion targets the concrete freeform WindowState surface rather than the root-task surface. Test whether foreground-pinned edge windows remain active during screenshots. Compare ordinary freeform and left/right edge-pinned windows. Sign before installation.\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-edge-candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
