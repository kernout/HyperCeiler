          61WoSVxwMCyGMio8i>;+&W-?T00GD)|BnFxeS^3fvBYQl0ssI200dcD
          B85
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,json,os,subprocess,xml.etree.ElementTree as E
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          w=Path(os.environ['RUNNER_TEMP'],'privacy')
          b=lzma.decompress(base64.b85decode(''.join((w/'payload.b85').read_text().split())))
          assert hashlib.sha256(b).hexdigest()=='16f5fd0f89385afda4623a1b157bafa51c92a98ebde05f073d84072067d28e9a'
          d=json.loads(b);m=d['manifest'];patch=d['patch'].encode()
          assert hashlib.sha256(patch).hexdigest()=='e8c085482ec128727deabb222c358c5015ba09efe328631869fb2edd2a7c3a86'==m['patch_sha256']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==m['baseline_commit']=='3b481faa688811fefbf434a09c8495b668e10c1b'
          f=Path('.github/workflows/pin-capture-test.yml')
          assert h(f)==m['pin_workflow_sha256']=='67dfe199a0f019dd71810c4f53da9b2223e7894db8a5811212516114e45636f1'
          s=f.read_text().splitlines();a=s.index("          python3 - <<'PY'")+1;z=s.index('          PY',a)
          assert all(not x.strip() or x.startswith(' '*10) for x in s[a:z])
          exec(compile('\n'.join(x[10:] if x else '' for x in s[a:z]),'verified-pin-injection','exec'),{'__name__':'__main__'})
          pin=m['pin_source_path'];assert h(pin)==m['pin_source_sha256']=='fad684d3319ee2bcb1a930eac425e8ef9599c7208db0bf7d4007f7ce800f8bc6'
          def snap():
              names=subprocess.check_output(['git','ls-files','-co','--exclude-standard','-z']).decode().split('\0')
              return {p:h(p) for p in names if p and Path(p).is_file()}
          before=snap()
          assert len(m['before'])==len(m['after'])==8
          for p,want in m['before'].items():
              assert (h(p) if Path(p).is_file() else None)==want,'preimage '+p
          p=w/'privacy.patch';p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          after=snap()
          assert {p for p in before.keys()|after.keys() if before.get(p)!=after.get(p)}==set(m['after'])
          assert all(h(p)==want for p,want in m['after'].items())
          assert h(pin)==m['pin_source_sha256']
          for p in m['after']:
              if p.endswith('.xml'): E.parse(p)
          subprocess.run(['git','diff','--check'],check=True)
          info=dict(m,variant='screenshot-privacy-test-v1',new_switches_default=False,
                    workflow_commit=os.environ.get('GITHUB_WORKFLOW_SHA') or os.environ['GITHUB_SHA'],
                    run_id=os.environ.get('GITHUB_RUN_ID',''),other_pin_files_unchanged=True,privacy_device_verified=False)
          (w/'build-info.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
      - name: Unsigned release
        shell: bash
        run: |
          set -euo pipefail
          test ! -f signing.properties
          printf '\nandroid.buildTypes.named("release") { signingConfig = null; versionNameSuffix = "-screenshot-privacy-test-v1" }\n' >> app/build.gradle.kts
      - name: Assemble
        env:
          GIT_ACTOR: ${{ secrets.GIT_ACTOR || github.actor }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,struct,subprocess,zipfile
          apks=list(Path('app/build/outputs/apk/release').rglob('*.apk'));assert len(apks)==1,apks
          src=apks[0];b=src.read_bytes()
          with zipfile.ZipFile(src) as z:
              assert z.testzip() is None
              names=z.namelist();assert all(n in names for n in ['AndroidManifest.xml','classes.dex','resources.arsc'])
              assert not any(n.upper().startswith('META-INF/') and (n.upper()=='META-INF/MANIFEST.MF' or n.upper().endswith(('.SF','.RSA','.DSA','.EC'))) for n in names)
          e=b.rfind(b'PK\x05\x06',max(0,len(b)-65557));assert e>=0 and e+22+struct.unpack_from('<H',b,e+20)[0]==len(b)
          cd=struct.unpack_from('<I',b,e+16)[0];assert 24<=cd<e and b[cd-16:cd]!=b'APK Sig Block 42'
          sdk=os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT');assert sdk
          signer=Path(sdk)/'build-tools/37.0.0/apksigner';assert signer.is_file()
          c=subprocess.run([str(signer),'verify','--verbose','--print-certs',str(src)],capture_output=True,text=True)
          log=c.stdout+c.stderr
          assert c.returncode==1 and 'DOES NOT VERIFY' in log and 'Missing META-INF/MANIFEST.MF' in log,log
          w=Path(os.environ['RUNNER_TEMP'],'privacy');info=json.loads((w/'build-info.json').read_text())
          assert hashlib.sha256(Path(info['pin_source_path']).read_bytes()).hexdigest()==info['pin_source_sha256']
          out=Path('artifacts');out.mkdir(exist_ok=True)
          apk=out/'HyperCeiler-screenshot-privacy-test-v1-unsigned.apk';shutil.copy2(src,apk)
          info.update(signed=False,apksigner_returncode=c.returncode,apk_sha256=hashlib.sha256(b).hexdigest(),apk_name=apk.name)
          (out/'build-info.json').write_text(json.dumps(info,indent=2)+'\n')
          (out/'apksigner.txt').write_text(log)
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.name!='SHA256SUMS'))
          print('PASS unsigned APK',info['apk_sha256'])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-screenshot-privacy-test-v1
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
