name: Screenshot privacy test
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: hyperceiler-screenshot-privacy-test-v1
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 3b481faa688811fefbf434a09c8495b668e10c1b
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
